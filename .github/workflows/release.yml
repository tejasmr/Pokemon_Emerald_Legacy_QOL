name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get install gcc-arm-none-eabi binutils-arm-none-eabi libcapstone-dev libpng-dev xdelta3
          git clone https://github.com/PikalaxALT/universal-pokemon-randomizer UPR -b fr-support
          cd UPR
          curl -fsSL https://downloads.sourceforge.net/project/launch4j/launch4j-3/3.14/launch4j-3.14-linux-x64.tgz | tar -xzv

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8

      - name: Install agbcc
        run: |
          git clone https://github.com/pret/agbcc.git
          cd agbcc
          ./build.sh
          ./install.sh ../

      - name: Build
        run: |
          make -j${nproc}

      - name: Generate patch
        env:
          POKEMON_EMERALD_BASE_ROM_REPOSITORY: ${{ secrets.POKEMON_EMERALD_BASE_ROM_REPOSITORY }}
          POKEMON_EMERALD_BASE_ROM_PAT: ${{ secrets.POKEMON_EMERALD_BASE_ROM_PAT }}
          GH_TOKEN: ${{ secrets.POKEMON_EMERALD_BASE_ROM_PAT }}
        run: |
          if [ -z "${POKEMON_EMERALD_BASE_ROM_REPOSITORY}" ] || [ -z "${POKEMON_EMERALD_BASE_ROM_PAT}" ]; then
            echo "POKEMON_EMERALD_BASE_ROM_REPOSITORY and POKEMON_EMERALD_BASE_ROM_PAT must be configured in repository Actions secrets." >&2
            exit 1
          fi
          gh auth setup-git
          git clone --depth 1 "https://github.com/${POKEMON_EMERALD_BASE_ROM_REPOSITORY}.git" base-rom
          base_rom=$(find base-rom -type f -iname '*.gba' -print -quit)
          if [ -z "${base_rom}" ]; then
            echo "No .gba file was found in ${POKEMON_EMERALD_BASE_ROM_REPOSITORY}." >&2
            exit 1
          fi
          cp "${base_rom}" pokeemerald-base.gba
          xdelta3 -e -s pokeemerald-base.gba pokeemerald.gba pokemon-emerald-legacy-qol-${GITHUB_REF_NAME}.xdelta

      - name: Package Release
        run: |
          export relname=pokemon-emerald-legacy-qol-${GITHUB_REF_NAME}
          mkdir ${relname}
          cp ${relname}.xdelta ${relname}/
          zip -r ${relname}.zip ${relname}/

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(git tag --sort=-version:refname | awk -v current="${RELEASE_TAG}" '$0 != current && $0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')
          if [ -z "${previous_tag}" ]; then
            echo "Could not determine the previous version tag for ${RELEASE_TAG}." >&2
            exit 1
          fi
          notes=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f previous_tag_name="${previous_tag}")
          release_title=$(printf '%s' "${notes}" | jq -r '.name')
          release_notes=$(printf '%s' "${notes}" | jq -r '.body')

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${release_title}" \
              --notes "${release_notes}"
            gh release upload "${RELEASE_TAG}" pokemon-emerald-legacy-qol-*.zip --clobber
          else
            gh release create "${RELEASE_TAG}" pokemon-emerald-legacy-qol-*.zip \
              --title "${release_title}" \
              --notes "${release_notes}"
          fi
